name: Compile and Release Resume

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect root TeX file and compiler
        id: detect
        run: |
          # Automatically find the file containing \documentclass
          ROOT_FILE=$(grep -rl '\\documentclass' . --include="*.tex" | head -n 1 | sed 's|^\./||')
          if [ -z "$ROOT_FILE" ]; then
            echo "Error: No .tex file with \\documentclass found!"
            exit 1
          fi
          echo "Found root LaTeX file: $ROOT_FILE"
          echo "root_file=$ROOT_FILE" >> $GITHUB_OUTPUT

          # Detect if fontspec or xelatex is required across TeX files and packages
          if grep -rqiE "fontspec|fontawesome|awesome-cv|xelatex" . --include="*.tex" --include="*.sty" --include="*.cls"; then
            echo "use_xelatex=true" >> $GITHUB_OUTPUT
          else
            echo "use_xelatex=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.detect.outputs.root_file }}
          latexmk_use_xelatex: ${{ steps.detect.outputs.use_xelatex }}

      - name: Rename PDF
        run: |
          PDF_NAME=$(find . -maxdepth 1 -name "*.pdf" | head -n 1)
          if [ -z "$PDF_NAME" ]; then
            echo "Error: No PDF was generated!"
            exit 1
          fi
          mv "$PDF_NAME" resume.pdf

      - name: Publish to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume
          draft: false
          prerelease: false
          files: resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp resume.pdf _site/resume.pdf
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=resume.pdf" />
              <title>Yesung Hwang - CV</title>
            </head>
            <body>
              <p>Redirecting to <a href="resume.pdf">resume.pdf</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
